<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="figure-size" content="1280x560">
<link rel="stylesheet" href="/app/brand.css">
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
  .card {
    position: relative; width: 1280px; height: 560px; overflow: hidden;
    background: var(--panel); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .copy { position: absolute; left: 60px; top: 58px; width: 400px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 52px; height: 52px; }
  .title { font: 600 54px/1 var(--serif); letter-spacing: -0.01em; }
  .tag { margin-top: 22px; font: 400 21px/1.4 var(--sans); color: var(--muted); }
  .spec { margin-top: 18px; font: 400 12px/1.6 var(--mono); color: var(--faint); }
  table { position: absolute; left: 60px; bottom: 60px; width: 380px; border-collapse: collapse; font-size: 14px; }
  caption { caption-side: top; text-align: left; font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding-bottom: 10px; }
  th, td { padding: 9px 0; border-top: 1px solid var(--line); text-align: left; font-weight: 400; }
  tr:last-child th, tr:last-child td { border-bottom: 1px solid var(--line-strong); }
  thead th { border-top: 1px solid var(--line-strong); font: 500 11px/1 var(--mono); color: var(--faint); }
  td { text-align: right; font: 400 14px/1 var(--mono); font-variant-numeric: tabular-nums; }
  th.r { text-align: right; }
  svg { position: absolute; left: 520px; top: 34px; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="brand"><img src="/app/mark.svg" alt=""><div class="title">NeoApnea<br>Monitor</div></div>
    <div class="tag">Open-source apnea detection for preterm infants.</div>
    <div class="spec">Arduino Mega 2560 · MPU-6050 · MAX30102<br>Browser monitor · simulator · Web Serial</div>
  </div>
  <table id="tbl"></table>
  <svg id="fig" width="720" height="492" viewBox="0 0 720 492"></svg>
</div>
<script type="module">
  import { points, range, record } from "./signals.js";
  import { SETTINGS } from "/app/js/engine.js";

  const { monitor, chest, ppg, frames } = record(80);
  const e = monitor.episodes[0];
  const t0 = e.start_s - 16, t1 = e.start_s + e.pause_s + 10;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { text: css("--text"), muted: css("--muted"), faint: css("--faint"), line: css("--line"), strong: css("--line-strong"),
    grid: css("--grid"), breath: css("--breath"), pulse: css("--pulse"), spo2: css("--spo2"), alarm: css("--alarm") };

  const L = 64, R = 664, W = R - L;
  const X = (t) => L + ((t - t0) / (t1 - t0)) * W;
  const panels = { a: { y: 26, h: 104 }, b: { y: 176, h: 84 }, c: { y: 306, h: 126 } };
  const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" fill="${o.color || C.muted}" font-family="${o.font || "IBM Plex Mono"}" font-size="${o.size || 10.5}" font-weight="${o.weight || 400}" text-anchor="${o.anchor || "start"}"${o.rot ? ` transform="rotate(-90 ${x} ${y})"` : ""}>${s}</text>`;
  const hl = (x0, x1, y, c, dash = "") => `<path d="M${x0} ${Math.round(y) + 0.5}H${x1}" stroke="${c}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
  const vl = (x, y0, y1, c, dash = "") => `<path d="M${Math.round(x) + 0.5} ${y0}V${y1}" stroke="${c}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;

  let s = "";
  const p0 = X(e.start_s), p1 = X(e.start_s + e.pause_s);
  // The apnea, shaded across all three panels.
  s += `<rect x="${p0}" y="${panels.a.y}" width="${p1 - p0}" height="${panels.c.y + panels.c.h - panels.a.y}" fill="${C.alarm}" fill-opacity="0.07"/>`;
  s += vl(p0, panels.a.y - 8, panels.c.y + panels.c.h, C.alarm, "3 3") + vl(p1, panels.a.y - 8, panels.c.y + panels.c.h, C.alarm, "3 3");
  s += txt((p0 + p1) / 2, panels.a.y - 12, `Apnea · ${e.pause_s.toFixed(1)} s without a breath`, { color: C.alarm, anchor: "middle", weight: 500 });

  // Grid lines every 5 s and the time axis.
  for (let rt = 0; rt <= t1 - t0; rt += 5) {
    const t = t0 + rt;
    for (const p of Object.values(panels)) s += vl(X(t), p.y, p.y + p.h, C.grid);
    s += vl(X(t), panels.c.y + panels.c.h, panels.c.y + panels.c.h + 4, C.strong);
    s += txt(X(t), panels.c.y + panels.c.h + 17, String(rt), { anchor: "middle" });
  }
  s += txt(R, panels.c.y + panels.c.h + 34, "Time (s)", { anchor: "end", color: C.faint });

  const frame = (key, label, unit, color) => {
    const p = panels[key];
    s += vl(L, p.y, p.y + p.h, C.strong) + hl(L, R, p.y + p.h, C.strong);
    s += txt(L - 44, p.y + 2, key.toUpperCase(), { color: C.text, size: 13, weight: 600, font: "IBM Plex Sans" });
    s += txt(L - 34, p.y + p.h / 2, `${label} (${unit})`, { anchor: "middle", rot: true, color });
  };

  // A: chest motion in g.
  const g = { t: chest.t, v: chest.v.map((v) => v / 16384) };
  const [alo, ahi] = range(g.v.filter((_, i) => g.t[i] >= t0 && g.t[i] <= t1), 0.12);
  frame("a", "Chest", "g", C.breath);
  for (const v of [Math.ceil(alo * 20) / 20, Math.floor(ahi * 20) / 20]) {
    const y = panels.a.y + panels.a.h - ((v - alo) / (ahi - alo)) * panels.a.h;
    s += hl(L - 4, L, y, C.strong) + txt(L - 7, y + 3.5, v.toFixed(2), { anchor: "end" });
  }
  s += `<polyline points="${points(g, t0, t1, alo, ahi, L, panels.a.y, W, panels.a.h)}" fill="none" stroke="${C.breath}" stroke-width="1.4" stroke-linejoin="round"/>`;
  s += hl(L, R, panels.a.y + panels.a.h - ((SETTINGS.breathThreshold / 16384 - alo) / (ahi - alo)) * panels.a.h, C.faint, "4 4");

  // B: the pulse wave.
  const [blo, bhi] = range(ppg.v.filter((_, i) => ppg.t[i] >= t0 && ppg.t[i] <= t1), 0.1);
  frame("b", "PPG", "a.u.", C.pulse);
  s += `<polyline points="${points(ppg, t0, t1, blo, bhi, L, panels.b.y, W, panels.b.h, 2)}" fill="none" stroke="${C.pulse}" stroke-width="1.1" stroke-linejoin="round"/>`;

  // C: heart rate (left axis) and SpO2 (right axis) as the monitor reported them.
  frame("c", "HR", "bpm", C.pulse);
  const fr = frames.filter((f) => f.t >= t0 && f.t <= t1 && f.hr > 0);
  const hrY = (v) => panels.c.y + panels.c.h - ((v - 60) / (180 - 60)) * panels.c.h;
  const spY = (v) => panels.c.y + panels.c.h - ((v - 60) / (100 - 60)) * panels.c.h;
  for (const v of [60, 100, 140, 180]) s += hl(L - 4, L, hrY(v), C.strong) + txt(L - 7, hrY(v) + 3.5, String(v), { anchor: "end" });
  s += vl(R, panels.c.y, panels.c.y + panels.c.h, C.strong);
  for (const v of [60, 80, 100]) s += hl(R, R + 4, spY(v), C.strong) + txt(R + 7, spY(v) + 3.5, String(v));
  s += txt(R + 34, panels.c.y + panels.c.h / 2, "SpO₂ (%)", { anchor: "middle", rot: true, color: C.spo2 });
  s += hl(L, R, hrY(SETTINGS.hrLow), C.pulse, "2 3") + hl(L, R, spY(SETTINGS.spo2Low), C.spo2, "2 3");
  const line = (f, Y, c) => `<polyline points="${fr.map((q) => `${X(q.t).toFixed(1)},${Y(f(q)).toFixed(1)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>`;
  s += line((q) => q.hr, hrY, C.pulse) + line((q) => q.spo2, spY, C.spo2);
  // Limit labels at the left end, away from the recovering traces.
  s += txt(L + 6, hrY(SETTINGS.hrLow) + 13, `HR limit ${SETTINGS.hrLow} bpm`, { color: C.pulse });
  s += txt(L + 6, spY(SETTINGS.spo2Low) - 5, `SpO₂ limit ${SETTINGS.spo2Low} %`, { color: C.spo2 });
  document.getElementById("fig").innerHTML = s;

  document.getElementById("tbl").innerHTML = `
    <caption>Recorded episode, simulator</caption>
    <thead><tr><th>Measure</th><th class="r">Value</th></tr></thead>
    <tbody>
      <tr><th>Pause</th><td>${e.pause_s.toFixed(1)} s</td></tr>
      <tr><th>Lowest heart rate in the pause</th><td>${e.hr_min} bpm</td></tr>
      <tr><th>Lowest SpO₂ in the pause</th><td>${e.spo2_min} %</td></tr>
    </tbody>`;
</script>
</body>
</html>
